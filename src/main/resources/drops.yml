# Here you can customize the drops for any mobs or types!
#
# To get started take a look on our wiki: https://mobcoins.flares.dev/drops/configure-drops

entity:
  zombie_example:
    entity: ZOMBIE
    # This will drop a random decimal number from 1 to 2
    drop_value: random_decimal(1,2)
    drop_action:
      - "[mobcoins_give] %pl_mobcoins%"
      - "[actionbar] &fYou killed a mob and received &6%pl_mobcoins%&f!"